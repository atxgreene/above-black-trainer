<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Above Black • Offline</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Space+Grotesk:wght@500;600&display=swap');
        body { font-family: 'Inter', system_ui, sans-serif; background: #0a0a0a; color: #e5e7eb; }
        .font-display { font-family: 'Space Grotesk', 'Inter', sans-serif; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-zinc-950">
    <div class="max-w-md text-center px-6">
        <div class="mx-auto w-20 h-20 bg-gradient-to-br from-emerald-400 to-teal-500 rounded-3xl flex items-center justify-center mb-8 shadow-2xl">
            <i class="fa-solid fa-infinity text-zinc-950 text-5xl"></i>
        </div>
        
        <h1 class="font-display text-5xl font-semibold tracking-tighter mb-4">Above Black</h1>
        <p class="text-2xl text-emerald-400 mb-2">You're offline</p>
        <p class="text-zinc-400 mb-8">Your resonance protocols are still available.<br>Core features work without internet.</p>

        <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-6 text-left mb-8">
            <div class="flex items-center gap-x-3 mb-4">
                <i class="fa-solid fa-check-circle text-emerald-400"></i>
                <span>Frequency Generator</span>
            </div>
            <div class="flex items-center gap-x-3 mb-4">
                <i class="fa-solid fa-check-circle text-emerald-400"></i>
                <span>Resonance Tuner</span>
            </div>
            <div class="flex items-center gap-x-3 mb-4">
                <i class="fa-solid fa-check-circle text-emerald-400"></i>
                <span>Training Lines</span>
            </div>
            <div class="flex items-center gap-x-3">
                <i class="fa-solid fa-check-circle text-emerald-400"></i>
                <span>Local Progress & Analytics</span>
            </div>
        </div>

        <button onclick="window.location.reload()" 
                class="w-full py-4 bg-emerald-500 hover:bg-emerald-600 text-zinc-950 font-semibold rounded-3xl transition-all flex items-center justify-center gap-x-3">
            <i class="fa-solid fa-sync-alt"></i>
            <span>Try Reconnecting</span>
        </button>

        <p class="text-xs text-zinc-500 mt-6">All your data is stored locally on this device.</p>
    </div>
</body>
</html>
